name: publish

# Publishes to PhotoSi's GitLab NuGet feed (project 24719592) — the same feed as SlsMessaging
# and the other PhotoSi packages, so services consume it with their usual nuget.config.
#
# Requires a repo secret NUGET_PASSWORD holding the GitLab WRITE credential (the same one GoCD
# uses, user 'package-repository-read-write'). GitLab authenticates via HTTP Basic (username +
# password), not the NuGet api-key, so we register the source with credentials before pushing.
#
# --skip-duplicate makes re-runs idempotent; a real publish happens only when <Version> in the
# csproj is bumped (the feed rejects overwriting an existing version).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack PhotoSiMessaging/PhotoSiMessaging.csproj -c Release -o artifacts

      - name: Push to PhotoSi GitLab feed
        run: |
          dotnet nuget add source https://gitlab.com/api/v4/projects/24719592/packages/nuget/index.json \
            --name gitlab \
            --username package-repository-read-write \
            --password "${{ secrets.NUGET_PASSWORD }}" \
            --store-password-in-clear-text
          dotnet nuget push "artifacts/*.nupkg" --source gitlab --skip-duplicate
